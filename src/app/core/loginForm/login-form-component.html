
<form 
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
    class="form-oval"
>
    <div class="form-row">

        <label for="email" > Email: </label>

        <input
            type="text"
            id="email"
            formControlName="email"
            required
        >
                
        <div 
            *ngIf="(
                loginForm.get('email')?.errors?.[ 'required' ]
                &&
                loginForm.get('email')?.touched
            )"
            class="err-class" >
            <h5>
                El email es requerido
            </h5>
        </div>


        <label for="password"> Password: </label>

        <input
            type="password"
            formControlName="password"
            id="password"
        >


        <button class="rounded-btn" type="submit">Login</button>
    
</div>

</form>
