<table
    mat-table
    [dataSource]="usersInTable"
    class="mat-elevation-z8"
>

    <ng-container matColumnDef="Name" >

        <th mat-header-cell *matHeaderCellDef > Name </th>
        <td mat-cell *matCellDef="let elementOfArray" >
            {{ elementOfArray?.userName }}
        </td>

    </ng-container>


    <ng-container matColumnDef="Email" >

        <th mat-header-cell *matHeaderCellDef > Email </th>
        <td mat-cell *matCellDef="let elementOfArray">
            {{ elementOfArray?.email }}
        </td>        

    </ng-container>


    <ng-container matColumnDef="Role">

        <th mat-header-cell *matHeaderCellDef > Role </th>
        <td mat-cell *matCellDef="let elementOfArray" >
            {{ elementOfArray?.role | uppercase}}
        </td>

    </ng-container>


    <ng-container matColumnDef="Actions" >

        <th mat-header-cell *matHeaderCellDef > Actions </th>
        <td mat-cell *matCellDef="let elementOfArray" >

            <button (click)="viewDetailSingularUserFromChild( elementOfArray )" mat-button color="accent">
                View
            </button>

            <button
                *ngIf="isAdminProp"
                (click)="editUserFromChild(elementOfArray)"
                mat-button color="primary"
            >
                Edit
            </button>

            <button
                *ngIf="isAdminProp"
                (click)="deleteUserFromChild( elementOfArray )"
                mat-button color="primary"
            >
                Delete
            </button>

        </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnTitles"></tr>
   
    <tr mat-row *matRowDef="let row; columns: columnTitles;"></tr>

</table>
