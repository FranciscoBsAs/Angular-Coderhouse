<table
    mat-table
    [dataSource]="[aSingularUser]"
    class="mat-elevation-z8"
>

    <ng-container matColumnDef="Name" >

        <th mat-header-cell *matHeaderCellDef > Name </th>

        <td mat-cell *matCellDef="let elementSingularUser" > 
            {{ elementSingularUser?.userName }}
        </td>

    </ng-container>


    <ng-container matColumnDef="Email" >

        <th mat-header-cell *matHeaderCellDef > Email </th>

        <td mat-cell *matCellDef="let elementSingularUser" > 
            {{ elementSingularUser?.email }}
        </td>

    </ng-container>


    <ng-container matColumnDef="Role" >

        <th mat-header-cell *matHeaderCellDef > Role </th>

        <td mat-cell *matCellDef="let elementSingularUser" > 
            {{ elementSingularUser?.role | uppercase}}
        </td>

    </ng-container>


    <tr
        mat-header-row
        *matHeaderRowDef="columnTitlesSingular"
    ></tr>

    <tr
        mat-row
        *matRowDef="let row ; columns: columnTitlesSingular"
    ></tr>

</table>
