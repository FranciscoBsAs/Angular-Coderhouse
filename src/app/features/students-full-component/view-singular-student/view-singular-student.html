<!---->

<table mat-table [dataSource]="[aSingularStudent]" class="mat-elevation-z8" >

    <ng-container matColumnDef="FullName" >

        <th mat-header-cell *matHeaderCellDef>Full-Name</th>
        <td mat-cell *matCellDef="let elementSingularStudent">
            {{elementSingularStudent | fullNamePipe }} 
        </td>

    </ng-container>


    
  <!-- Name Column -->
    <ng-container matColumnDef="DNI">
        <th mat-header-cell *matHeaderCellDef> DNI </th>
        <td mat-cell *matCellDef="let elementSingularStudent">
            {{elementSingularStudent?.dni}}
        </td>
    </ng-container>


    <!-- Name Column -->
    <ng-container matColumnDef="Age">
        <th mat-header-cell *matHeaderCellDef> Age </th>
        <td mat-cell *matCellDef="let elementSingularStudent">
            {{elementSingularStudent?.age}}
        </td>
    </ng-container>
  

      <!-- Name Column -->
    <ng-container matColumnDef="Average">
        <th mat-header-cell *matHeaderCellDef> Average </th>
        <td mat-cell *matCellDef="let elementSingularStudent">
            {{elementSingularStudent?.average}}
        </td>
    </ng-container>


  <!-- Name Column -->
    <ng-container matColumnDef="Registered Courses">
        <th mat-header-cell *matHeaderCellDef> Registered Courses </th>
        <td mat-cell *matCellDef="let elementSingularStudent">

        <!--    {{ elementSingularStudent?.courses?.join(' | ')  }} -->


        <ul>
            <li *ngFor="let course of elementSingularStudent?.courses" >

                {{ course }}
            
            </li>
        </ul>


        </td>
    </ng-container>    


    <tr mat-header-row *matHeaderRowDef="columnTitlesSingular"></tr>
    <tr mat-row *matRowDef="let row; columns: columnTitlesSingular;"></tr>

</table>
